# ==========================================================
# Configuracion de NikFashion Spring
# ==========================================================
spring.application.name=nikfashion-spring

# Puerto 8081 para no chocar con Tomcat de la evidencia anterior (8080)
server.port=8081

# ---------- Base de datos (MySQL de XAMPP) ----------
spring.datasource.url=jdbc:mysql://localhost:3306/nikfashion?useSSL=false&serverTimezone=America/Bogota&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=

# ---------- Sesion ----------
# Guarda la sesion solo en cookie (evita ";jsessionid=" en las URL)
server.servlet.session.tracking-modes=cookie

# ---------- JPA / Hibernate ----------
# Nota: con el MySQL de XAMPP (MariaDB) Hibernate muestra un aviso "HHH000511"
# sobre la version 5.5.5. Es solo informativo y no afecta el funcionamiento.
# "update": Hibernate crea o ajusta la tabla segun la entidad Producto
spring.jpa.hibernate.ddl-auto=update
# Muestra en consola las sentencias SQL que genera Hibernate (util para aprender)
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# ---------- Thymeleaf ----------
# Sin cache para ver los cambios del HTML sin reiniciar
spring.thymeleaf.cache=false
